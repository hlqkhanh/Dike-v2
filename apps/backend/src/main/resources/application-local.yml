dike:
  environment: local
  demo:
    seed-enabled: ${DIKE_DEMO_SEED_ENABLED:true}
  identity:
    simulated-full-access-enabled: ${DIKE_SIMULATED_FULL_ACCESS_ENABLED:true}
  auth:
    dev-login-enabled: ${DIKE_DEV_AUTH_ENABLED:false}
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8081
      - http://localhost:19006
  migrations:
    enabled: true

name: dike

services:
  mongo:
    image: mongo:8.0.32-noble
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - dike-mongo:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --host localhost:27017 --eval
          "try { rs.status().ok } catch (error) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
          | grep 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine3.23
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - dike-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: dike-local
      MINIO_ROOT_PASSWORD: dike-local-secret
      MINIO_DEFAULT_BUCKETS: dike-public:download,dike-private:none
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - dike-minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  dike-mongo:
    name: dike-mongo
  dike-redis:
    name: dike-redis
  dike-minio:
    name: dike-minio

spring:
  application:
    name: dike-backend
  mongodb:
    database: ${DIKE_MONGODB_DATABASE:dike}
    uri: ${DIKE_MONGODB_URI:mongodb://localhost:27017/dike?replicaSet=rs0}
  data:
    mongodb:
      auto-index-creation: false
    redis:
      host: ${DIKE_REDIS_HOST:localhost}
      port: ${DIKE_REDIS_PORT:6379}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${DIKE_GOOGLE_CLIENT_ID:local-not-configured}
            client-secret: ${DIKE_GOOGLE_CLIENT_SECRET:local-not-configured}
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_basic
            scope: openid,email,profile
            redirect-uri: "{baseUrl}/api/v1/auth/callback/{registrationId}"
  session:
    timeout: 24h
    data:
      redis:
        repository-type: indexed
        namespace: dike:${dike.environment}:session
  lifecycle:
    timeout-per-shutdown-phase: 30s

dike:
  environment: ${DIKE_ENVIRONMENT:local}
  workload: ${DIKE_WORKLOAD:api}
  service:
    version: ${DIKE_SERVICE_VERSION:dev}
  storage:
    endpoint: ${DIKE_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${DIKE_STORAGE_REGION:us-east-1}
    access-key: ${DIKE_STORAGE_ACCESS_KEY:dike-local}
    secret-key: ${DIKE_STORAGE_SECRET_KEY:dike-local-secret}
    public-bucket: ${DIKE_STORAGE_PUBLIC_BUCKET:dike-public}
    private-bucket: ${DIKE_STORAGE_PRIVATE_BUCKET:dike-private}
    timeout: ${DIKE_STORAGE_TIMEOUT:3s}
  outbox:
    poll-interval: ${DIKE_OUTBOX_POLL_INTERVAL:1s}
    lease-duration: ${DIKE_OUTBOX_LEASE_DURATION:30s}
    initial-backoff: ${DIKE_OUTBOX_INITIAL_BACKOFF:2s}
    max-backoff: ${DIKE_OUTBOX_MAX_BACKOFF:5m}
    max-attempts: ${DIKE_OUTBOX_MAX_ATTEMPTS:8}
    batch-size: ${DIKE_OUTBOX_BATCH_SIZE:20}
  auth:
    public-base-url: ${DIKE_AUTH_PUBLIC_BASE_URL:http://localhost:3000}
    allowed-origins: ${DIKE_AUTH_ALLOWED_ORIGINS:http://localhost:3000}
    require-phone-otp: ${REQUIRE_PHONE_OTP:false}
    session:
      idle-timeout: 24h
      absolute-lifetime: 30d
      last-seen-write-interval: 5m
      maximum-per-user: 10
    cookie:
      name: ${DIKE_SESSION_COOKIE_NAME:DIKE_SESSION}
      secure: ${DIKE_SESSION_COOKIE_SECURE:false}
      same-site: Lax
    google:
      issuer: https://accounts.google.com
      registration-id: google
  otp:
    provider: ${DIKE_OTP_PROVIDER:fake}
    hmac-secret: ${DIKE_OTP_HMAC_SECRET:local-only-otp-hmac-secret-change-me}
    rate-key-secret: ${DIKE_OTP_RATE_KEY_SECRET:local-only-rate-key-secret-change-me}
    key-version: ${DIKE_OTP_KEY_VERSION:local-v1}
    lifetime: ${DIKE_OTP_LIFETIME:5m}
    resend-cooldown: ${DIKE_OTP_RESEND_COOLDOWN:60s}
    maximum-attempts: ${DIKE_OTP_MAXIMUM_ATTEMPTS:5}
    send-enabled: ${DIKE_OTP_SEND_ENABLED:true}
    daily-cap: ${DIKE_OTP_DAILY_CAP:1000}
  admin-bootstrap:
    enabled: ${DIKE_ADMIN_BOOTSTRAP_ENABLED:false}
    dry-run: ${DIKE_ADMIN_BOOTSTRAP_DRY_RUN:true}
    account-id: ${DIKE_ADMIN_BOOTSTRAP_ACCOUNT_ID:}
    operator: ${DIKE_ADMIN_BOOTSTRAP_OPERATOR:}
    reason: ${DIKE_ADMIN_BOOTSTRAP_REASON:}
  profile:
    documents:
      terms-version: ${DIKE_TERMS_VERSION:2026-10-06}
      terms-url: ${DIKE_TERMS_URL:http://localhost:3000/legal/terms}
      privacy-version: ${DIKE_PRIVACY_VERSION:2026-10-06}
      privacy-url: ${DIKE_PRIVACY_URL:http://localhost:3000/legal/privacy}
      age-version: ${DIKE_AGE_ATTESTATION_VERSION:2026-10-06}
    files:
      upload-ttl: ${DIKE_FILE_UPLOAD_TTL:5m}
      download-ttl: ${DIKE_FILE_DOWNLOAD_TTL:60s}
      cleanup-age: ${DIKE_FILE_CLEANUP_AGE:24h}
      cleanup-interval: ${DIKE_FILE_CLEANUP_INTERVAL:1h}
      public-base-url: ${DIKE_PUBLIC_OBJECT_BASE_URL:http://localhost:9000/dike-public/}
      inspector: ${DIKE_FILE_INSPECTOR:basic}
      avatar-maximum-bytes: ${DIKE_AVATAR_MAXIMUM_BYTES:5242880}
      verification-maximum-bytes: ${DIKE_VERIFICATION_MAXIMUM_BYTES:10485760}
      maximum-image-pixels: ${DIKE_MAXIMUM_IMAGE_PIXELS:20000000}
    deletion:
      waiting-period: ${DIKE_ACCOUNT_DELETION_WAITING_PERIOD:7d}
      policy-version: ${DIKE_ACCOUNT_DELETION_POLICY_VERSION:account-deletion-v1}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,mongo,redis,objectStorage
  endpoints:
    web:
      exposure:
        include: health

server:
  shutdown: graceful

springdoc:
  api-docs:
    path: /api/openapi.json
  packages-to-scan: com.dike
  paths-to-match: /api/v1/**

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}
        serviceVersion: ${dike.service.version}
        environment: ${dike.environment}
        workload: ${dike.workload}
